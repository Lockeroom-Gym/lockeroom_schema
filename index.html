// ============================================================
// AUTH GUARD — ported from src/lib/supabase.js + src/lib/auth.js
// ============================================================
(function () {
  // Credentials loaded from config.js
  const { createClient } = window.supabase;
  window._supabase = createClient(window.__config.SUPABASE_URL, window.__config.SUPABASE_ANON_KEY);

  // ── syncUserWithDatabase — mirrors src/lib/auth.js ─────────────────────────
  // Called after Google OAuth redirect lands here, ensuring the user is linked
  // in staff_database (by auth_id or personal_email match, else inserted).
  async function syncUserWithDatabase() {
    try {
      const { data: userData, error: userError } = await window._supabase.auth.getUser();
      if (userError || !userData?.user?.id) return;

      const user = userData.user;

      // 1. Already linked by auth_id
      const { data: byAuthId } = await window._supabase
        .from('staff_database').select('*').eq('auth_id', user.id).maybeSingle();
      if (byAuthId) return;

      // 2. Try matching by personal_email
      const normalizedEmail = user.email?.trim().toLowerCase() ?? null;
      if (normalizedEmail) {
        const { data: byEmail } = await window._supabase
          .from('staff_database').select('*').eq('personal_email', normalizedEmail).maybeSingle();

        if (byEmail) {
          if (byEmail.auth_id && byEmail.auth_id !== user.id) return;
          if (byEmail.auth_id === user.id) return;
          await window._supabase
            .from('staff_database').update({ auth_id: user.id }).eq('personal_email', normalizedEmail);
          return;
        }
      }

      // 3. No match — insert new staff row
      const fullName = user.user_metadata?.full_name || '';
      const [firstToken = '', ...rest] = fullName.trim().split(/\s+/).filter(Boolean);
      await window._supabase.from('staff_database').insert({
        auth_id:        user.id,
        personal_email: normalizedEmail,
        first_name:     firstToken || null,
        last_name:      rest.length ? rest.join(' ') : null,
        mobile_number:  null,
      });
    } catch (err) {
      console.error('syncUserWithDatabase error:', err);
    }
  }

  // ── fetchStaffDetailsByAuthId — mirrors src/lib/auth.js ────────────────────
  async function fetchStaffDetailsByAuthId(authId) {
    const { data, error } = await window._supabase
      .from('staff_database').select('*').eq('auth_id', authId).maybeSingle();
    return { staffDetails: data ?? null, error };
  }

  // ── initAuth — mirrors src/components/ProtectedRoute.jsx logic ─────────────
  async function initAuth() {
    const { data: { session } } = await window._supabase.auth.getSession();

    if (!session) {
      window.location.replace('/login.html');
      return;
    }

    const user = session.user;

    // Run sync in case this is a fresh Google OAuth callback
    await syncUserWithDatabase();

    // Resolve display name from staff_database, then OAuth metadata, then email
    let displayName = user.user_metadata?.full_name
                   || user.user_metadata?.name
                   || user.email;

    const { staffDetails } = await fetchStaffDetailsByAuthId(user.id);
    if (staffDetails) {
      const name = staffDetails.name
                || staffDetails.full_name
                || (staffDetails.first_name
                    ? [staffDetails.first_name, staffDetails.last_name].filter(Boolean).join(' ')
                    : null);
      if (name) displayName = name;
    }

    // Populate welcome message — avatar initial + name
    const welcomeMsg    = document.getElementById('welcome-msg');
    const welcomeAvatar = document.getElementById('welcome-avatar');
    const welcomeText   = document.getElementById('welcome-text');
    if (welcomeMsg && welcomeAvatar && welcomeText) {
      welcomeAvatar.textContent = displayName.charAt(0);
      welcomeText.innerHTML = `Welcome, <strong>${displayName}</strong>`;
      welcomeMsg.style.display = 'flex';
    }

    // Remove loading overlay — reveal the app
    const overlay = document.getElementById('auth-overlay');
    if (overlay) overlay.remove();
  }

  // ── signOut — mirrors src/lib/auth.js signOut() ─────────────────────────────
  window._handleSignOut = async function () {
    await window._supabase.auth.signOut();
    window.location.replace('/login.html');
  };

  // Redirect on session expiry / explicit sign-out from another tab
  window._supabase.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') window.location.replace('/login.html');
  });

  initAuth();
})();

// ============================================================
// VISUALIZATION ENGINE
// ============================================================

const W = window.innerWidth;
const H = window.innerHeight;

// Compute degree map
const degMap = {};
RAW_LINKS.forEach(l => {
  if (l.s !== l.t) { // skip self-refs for degree
    degMap[l.s] = (degMap[l.s] || 0) + 1;
    degMap[l.t] = (degMap[l.t] || 0) + 1;
  }
});

// Build nodes & links
const nodes = RAW_NODES.map(n => ({
  ...n,
  degree: degMap[n.id] || 0,
  r: n.hub ? Math.max(10, Math.min(20, 8 + (degMap[n.id]||0)*0.55))
           : Math.max(5, Math.min(13, 4 + (degMap[n.id]||0)*0.55)),
}));
const nodeById = {};
nodes.forEach(n => nodeById[n.id] = n);

const links = RAW_LINKS.map(l => ({ source: l.s, target: l.t, lbl: l.lbl }));

// Update stats
document.getElementById('sv-tables').textContent = nodes.length;
document.getElementById('sv-links').textContent = links.length;

// Domain ring positions
const domKeys = Object.keys(DOMAINS);
const domCenters = {};
domKeys.forEach((k, i) => {
  const angle = (i / domKeys.length) * 2 * Math.PI - Math.PI/2;
  domCenters[k] = {
    x: W/2 + Math.cos(angle) * W * 0.3,
    y: H/2 + Math.sin(angle) * H * 0.28,
  };
});

// ——— SVG Setup ———
const svg = d3.select("#graph");

// Defs: glow filters
const defs = svg.select("defs");
domKeys.forEach(k => {
  const f = defs.append("filter").attr("id", `glow-${k}`)
    .attr("x","-60%").attr("y","-60%").attr("width","220%").attr("height","220%");
  f.append("feGaussianBlur").attr("stdDeviation","4").attr("result","b");
  const m = f.append("feMerge");
  m.append("feMergeNode").attr("in","b");
  m.append("feMergeNode").attr("in","SourceGraphic");
});
// Subtle outer glow for hubs
defs.append("filter").attr("id","glow-hub")
  .attr("x","-80%").attr("y","-80%").attr("width","260%").attr("height","260%")
  .append("feGaussianBlur").attr("stdDeviation","7").attr("result","b");
d3.select("#glow-hub").append("feMerge")
  .call(m => { m.append("feMergeNode").attr("in","b"); m.append("feMergeNode").attr("in","SourceGraphic"); });

// Zoom & pan
const zoom = d3.zoom().scaleExtent([0.15, 5])
  .on("zoom", ({transform}) => g.attr("transform", transform));
svg.call(zoom);

const g = svg.append("g");

// ——— Force Simulation ———
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(d => {
      const sn = nodeById[typeof d.source==='object'?d.source.id:d.source];
      const tn = nodeById[typeof d.target==='object'?d.target.id:d.target];
      return sn && tn && sn.domain === tn.domain ? 65 : 120;
    })
    .strength(0.35)
  )
  .force("charge", d3.forceManyBody().strength(-260))
  .force("collide", d3.forceCollide().radius(d => d.r + 7).strength(0.85))
  .force("clusterX", d3.forceX(d => domCenters[d.domain]?.x ?? W/2).strength(0.09))
  .force("clusterY", d3.forceY(d => domCenters[d.domain]?.y ?? H/2).strength(0.09))
  .force("center", d3.forceCenter(W/2, H/2).strength(0.04));

// ——— Render Layers ———

// Hull layer (domain blobs)
const hullLayer = g.append("g").attr("class","hulls");
const hullPaths = hullLayer.selectAll(".hull-path")
  .data(domKeys).join("path").attr("class","hull-path")
  .attr("fill", k => DOMAINS[k].color + "0e")
  .attr("stroke", k => DOMAINS[k].color + "22")
  .attr("stroke-width", 2)
  .attr("stroke-linejoin","round");

// Domain label layer
const domLabelLayer = g.append("g").attr("class","dom-labels");
const domLabels = domLabelLayer.selectAll(".dom-label")
  .data(domKeys).join("text").attr("class","dom-label")
  .attr("text-anchor","middle")
  .attr("fill", k => DOMAINS[k].color + "55")
  .attr("font-size","10")
  .attr("font-family","-apple-system, sans-serif")
  .attr("font-weight","700")
  .attr("letter-spacing","0.1em")
  .attr("pointer-events","none")
  .text(k => DOMAINS[k].label.toUpperCase());

// Link layer
const linkLayer = g.append("g").attr("class","links");
const linkSel = linkLayer.selectAll(".link-line")
  .data(links).join("line").attr("class","link-line")
  .attr("stroke", d => {
    const sn = nodeById[typeof d.source==='object'?d.source.id:d.source];
    return sn ? DOMAINS[sn.domain]?.color + "28" : "#ffffff18";
  })
  .attr("stroke-width", 1);

// Node layer
const nodeLayer = g.append("g").attr("class","nodes");
const nodeGs = nodeLayer.selectAll(".ng")
  .data(nodes).join("g").attr("class","ng")
  .call(d3.drag()
    .on("start", (e,d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end",   (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  );

// Outer halo ring
nodeGs.append("circle")
  .attr("r", d => d.r + 5)
  .attr("fill","none")
  .attr("stroke", d => DOMAINS[d.domain]?.color + "20")
  .attr("stroke-width", 1)
  .attr("pointer-events","none");

// Hub pulse ring (for hub nodes)
nodeGs.filter(d => d.hub).append("circle")
  .attr("r", d => d.r + 10)
  .attr("fill","none")
  .attr("stroke", d => DOMAINS[d.domain]?.color + "12")
  .attr("stroke-width", 1.5)
  .attr("pointer-events","none")
  .append("animate")
    .attr("attributeName","r")
    .attr("values", d => `${d.r+10};${d.r+18};${d.r+10}`)
    .attr("dur","3s")
    .attr("repeatCount","indefinite");

// Main node circle
nodeGs.append("circle")
  .attr("class","node-circle")
  .attr("r", d => d.r)
  .attr("fill", d => d.hub ? DOMAINS[d.domain]?.color : DOMAINS[d.domain]?.color + "60")
  .attr("stroke", d => DOMAINS[d.domain]?.color)
  .attr("stroke-width", d => d.hub ? 1.5 : 0.8)
  .attr("filter", d => d.hub ? `url(#glow-${d.domain})` : null)
  .style("cursor","pointer");

// Label
nodeGs.append("text")
  .attr("class","node-label")
  .attr("dy", d => d.r + 10)
  .attr("text-anchor","middle")
  .text(d => d.id.length > 24 ? d.id.slice(0,22)+"…" : d.id);

// ——— Tick ———
sim.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

  nodeGs.attr("transform", d => `translate(${d.x},${d.y})`);

  // Domain hulls
  const dmapPts = {};
  nodes.forEach(n => {
    if (!dmapPts[n.domain]) dmapPts[n.domain] = [];
    dmapPts[n.domain].push([n.x, n.y]);
  });

  hullPaths.attr("d", k => {
    const pts = dmapPts[k];
    if (!pts || pts.length < 3) return null;
    const h = d3.polygonHull(pts);
    if (!h) return null;
    const cx = d3.mean(h, p=>p[0]), cy = d3.mean(h, p=>p[1]);
    const exp = h.map(p => [cx + (p[0]-cx)*1.35, cy + (p[1]-cy)*1.35]);
    return "M"+exp.join("L")+"Z";
  });

  // Domain label positions (centroid of domain nodes)
  domLabels.attr("x", k => {
    const pts = dmapPts[k];
    return pts ? d3.mean(pts, p=>p[0]) : domCenters[k]?.x ?? W/2;
  }).attr("y", k => {
    const pts = dmapPts[k];
    if (!pts) return domCenters[k]?.y ?? H/2;
    const minY = d3.min(pts, p=>p[1]);
    return minY - 18;
  });
});

// ——— Interaction ———
let selectedId = null;
let hiddenDomains = new Set();

function getNeighbors(id) {
  const s = new Set([id]);
  links.forEach(l => {
    const sid = typeof l.source==='object'?l.source.id:l.source;
    const tid = typeof l.target==='object'?l.target.id:l.target;
    if (sid===id) s.add(tid);
    if (tid===id) s.add(sid);
  });
  return s;
}

function getConnectedLinks(id) {
  return links.filter(l => {
    const sid = typeof l.source==='object'?l.source.id:l.source;
    const tid = typeof l.target==='object'?l.target.id:l.target;
    return sid===id || tid===id;
  });
}

function highlight(id) {
  selectedId = id;
  const neighbors = getNeighbors(id);
  const connLinks = getConnectedLinks(id);
  const connLinkSet = new Set(connLinks);

  nodeGs.select(".node-circle")
    .attr("opacity", d => hiddenDomains.has(d.domain) ? 0 : (id ? (neighbors.has(d.id) ? 1 : 0.08) : 1));
  nodeGs.select(".node-label")
    .attr("opacity", d => hiddenDomains.has(d.domain) ? 0 : (id ? (neighbors.has(d.id) ? 0.9 : 0.04) : 0.5));
  nodeGs.selectAll("circle:not(.node-circle)")
    .attr("opacity", d => hiddenDomains.has(d.domain) ? 0 : (id ? (neighbors.has(d.id) ? 1 : 0.03) : 1));

  linkSel.attr("opacity", d => id ? (connLinkSet.has(d) ? 1 : 0.04) : 1)
    .attr("stroke", d => {
      if (!id) {
        const sn = nodeById[typeof d.source==='object'?d.source.id:d.source];
        return sn ? DOMAINS[sn.domain]?.color + "28" : "#ffffff18";
      }
      return connLinkSet.has(d) ? DOMAINS[nodeById[typeof d.source==='object'?d.source.id:d.source]?.domain]?.color + "cc" : "#ffffff06";
    })
    .attr("stroke-width", d => connLinkSet.has(d) && id ? 1.5 : 1)
    .classed("link-active", d => connLinkSet.has(d) && !!id);

  hullPaths.attr("opacity", k => hiddenDomains.has(k) ? 0 : (id ? 0.4 : 1));

  if (id) showInfoPanel(id, neighbors, connLinks);
  else document.getElementById('info-panel').classList.remove('vis');
}

function showInfoPanel(id, neighbors, connLinks) {
  const n = nodeById[id];
  if (!n) return;
  const panel = document.getElementById('info-panel');
  const dom = DOMAINS[n.domain];

  document.getElementById('itag').textContent = dom.label;
  document.getElementById('itag').style.background = dom.color + "25";
  document.getElementById('itag').style.color = dom.color;
  document.getElementById('ititle').textContent = n.id;
  document.getElementById('idesc').textContent = n.desc;
  document.getElementById('istat').textContent = `${n.degree} connections · ${n.hub ? 'Hub table' : 'Table'}`;

  const list = document.getElementById('icon-list');
  list.innerHTML = '';
  connLinks.slice(0, 10).forEach(l => {
    const sid = typeof l.source==='object'?l.source.id:l.source;
    const tid = typeof l.target==='object'?l.target.id:l.target;
    const otherId = sid===id ? tid : sid;
    const dir = sid===id ? '→' : '←';
    const div = document.createElement('div');
    div.className = 'icon-item';
    div.innerHTML = `<span style="color:${DOMAINS[nodeById[otherId]?.domain]?.color||'#fff'}88">${dir}</span> ${otherId} <span>${l.lbl}</span>`;
    div.style.cursor = 'pointer';
    div.onclick = () => highlight(otherId);
    list.appendChild(div);
  });
  if (connLinks.length > 10) {
    const more = document.createElement('div');
    more.className = 'icon-item';
    more.style.color = 'rgba(255,255,255,0.25)';
    more.textContent = `…and ${connLinks.length-10} more`;
    list.appendChild(more);
  }

  panel.classList.add('vis');
}

// Node click
nodeGs.on("click", (e, d) => {
  e.stopPropagation();
  if (selectedId === d.id) { selectedId=null; highlight(null); }
  else highlight(d.id);
});

// Tooltip on hover
const tooltip = document.getElementById('tooltip');
nodeGs.on("mouseover", (e, d) => {
  if (selectedId) return;
  tooltip.innerHTML = `<strong style="color:${DOMAINS[d.domain]?.color}">${d.id}</strong><br>${d.desc}`;
  tooltip.style.display = 'block';
}).on("mousemove", e => {
  tooltip.style.left = (e.pageX + 14)+'px';
  tooltip.style.top = (e.pageY - 10)+'px';
}).on("mouseout", () => { tooltip.style.display='none'; });

// Click on background = deselect
svg.on("click", () => { selectedId=null; highlight(null); });

// Info panel close
document.getElementById('info-close').onclick = () => { selectedId=null; highlight(null); };

// ——— Legend ———
const legendGrid = document.getElementById('legend-grid');
domKeys.forEach(k => {
  const dom = DOMAINS[k];
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.innerHTML = `<div class="ldot" style="background:${dom.color}"></div>${dom.label}`;
  row.title = `Toggle ${dom.label}`;
  row.onclick = () => {
    if (hiddenDomains.has(k)) {
      hiddenDomains.delete(k);
      row.classList.remove('dimmed');
    } else {
      hiddenDomains.add(k);
      row.classList.add('dimmed');
    }
    applyDomainVisibility();
  };
  legendGrid.appendChild(row);
});

function applyDomainVisibility() {
  nodeGs.attr("opacity", d => hiddenDomains.has(d.domain) ? 0 : 1)
        .attr("pointer-events", d => hiddenDomains.has(d.domain) ? "none" : "all");
  linkSel.attr("opacity", d => {
    const sn = nodeById[typeof d.source==='object'?d.source.id:d.source];
    const tn = nodeById[typeof d.target==='object'?d.target.id:d.target];
    return (hiddenDomains.has(sn?.domain) || hiddenDomains.has(tn?.domain)) ? 0 : 1;
  });
  hullPaths.attr("opacity", k => hiddenDomains.has(k) ? 0 : 1);
}

// ——— Search ———
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { highlight(null); return; }
  const match = nodes.find(n => n.id.toLowerCase().includes(q));
  if (match) {
    highlight(match.id);
    // Pan to node
    const t = d3.zoomTransform(svg.node());
    svg.transition().duration(600).call(
      zoom.transform,
      d3.zoomIdentity.translate(W/2 - t.k*match.x, H/2 - t.k*match.y).scale(t.k)
    );
  }
});

// ——— Reset ———
document.getElementById('reset-btn').onclick = () => {
  selectedId = null; highlight(null);
  hiddenDomains.clear();
  document.querySelectorAll('.legend-row').forEach(r => r.classList.remove('dimmed'));
  applyDomainVisibility();
  svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(0,0).scale(1));
  document.getElementById('search').value = '';
};

// ——— Expand ———
let expanded = false;
document.getElementById('expand-btn').onclick = () => {
  expanded = !expanded;
  document.getElementById('expand-btn').textContent = expanded ? '⊖ Collapse' : '⊕ Expand All';
  sim.force("clusterX", d3.forceX(d => domCenters[d.domain]?.x ?? W/2).strength(expanded ? 0.02 : 0.09));
  sim.force("clusterY", d3.forceY(d => domCenters[d.domain]?.y ?? H/2).strength(expanded ? 0.02 : 0.09));
  sim.force("charge", d3.forceManyBody().strength(expanded ? -480 : -260));
  sim.alpha(0.5).restart();
};

// ——— Resize ———
window.addEventListener('resize', () => {
  const W2=window.innerWidth, H2=window.innerHeight;
  sim.force("center", d3.forceCenter(W2/2, H2/2));
  sim.alpha(0.2).restart();
});

// ——— Sign-out button ———
document.getElementById('signout-btn').addEventListener('click', () => {
  window._handleSignOut();
});
</script>
</body>
