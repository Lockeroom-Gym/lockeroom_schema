name: Update Schema Map

on:
  schedule:
    # Runs every day at 06:00 UTC (4pm AEST / 5pm AEDT)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Commit even if no schema changes detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  update-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run schema update
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run update-schema

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet schema-neural-map.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No schema changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝  Schema changes detected"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' || inputs.force_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schema-neural-map.html
          git commit -m "chore: update schema map $(date +%Y-%m-%d)"
          git push
